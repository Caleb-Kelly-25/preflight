# AWS Identity and Access Management
#
# VERIFICATION STATUS — all entries remain `draft`.
#
# Checked 2026-09-01 against AWS's own policy validator
# (accessanalyzer:ValidatePolicy, which is authoritative for action names):
#   ✓ all 19 action names below exist and are spelled correctly
#   ✓ every arn_format matches the resource type its actions accept
#
# NOT checked, and the reason these are still draft:
#   ✗ COMPLETENESS. Nothing here establishes that Terraform's apply needs only
#     these actions. A missing action produces a false "allowed" for a deploy
#     that will fail, so name correctness alone is not enough to promote an
#     entry. See mappings/README.md.
#
# Known suspected gaps, listed rather than guessed at:
#   - iam:TagRole / iam:TagPolicy are mapped unconditionally, but are only
#     needed when tags are set. This OVER-reports, which causes false positives
#     rather than false negatives — the safer direction, but still wrong.
#   - Deleting a role that still has inline policies or attachments requires
#     removing them first; whether the provider does that itself is unresolved.
#   - iam:PassRole is needed by whichever resource HANDS a role to a service,
#     not by the role. The schema cannot express that yet.
#
# Reference: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html

resources:
  - type: aws_iam_role
    service: iam
    status: draft
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:role/${RoleName}"
    arn_attributes:
      RoleName: name
    context_keys:
      "aws:RequestTag/*":
        from: tags
    operations:
      create:
        - iam:CreateRole
        - iam:TagRole
      update:
        - iam:UpdateRole
        - iam:UpdateAssumeRolePolicy
        - iam:TagRole
        - iam:UntagRole
      delete:
        - iam:DeleteRole
    notes: >-
      iam:TagRole is only required when tags are set, and the update actions
      depend on which attributes changed. Conditional actions are not yet
      modelled by the schema, so this over-reports required permissions; see
      docs/ARCHITECTURE.md, open question 3.

      Separately: any OTHER resource that hands this role to a service (an ECS
      task definition, a Lambda function) needs iam:PassRole on it. That is a
      cross-resource requirement this per-resource schema does not yet express.

  - type: aws_iam_policy
    service: iam
    status: draft
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:policy/${PolicyName}"
    arn_attributes:
      PolicyName: name
    operations:
      create:
        - iam:CreatePolicy
        - iam:TagPolicy
      update:
        - iam:CreatePolicyVersion
        - iam:DeletePolicyVersion
      delete:
        - iam:DeletePolicy
    notes: >-
      Terraform updates a managed policy by creating a new version, and prunes
      old versions when the five-version limit is reached, hence
      iam:DeletePolicyVersion on update.

  - type: aws_iam_role_policy_attachment
    service: iam
    status: draft
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:role/${RoleName}"
    arn_attributes:
      RoleName: role
    operations:
      create:
        - iam:AttachRolePolicy
      update:
        - iam:AttachRolePolicy
        - iam:DetachRolePolicy
      delete:
        - iam:DetachRolePolicy

  - type: aws_iam_role_policy
    service: iam
    status: draft
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:role/${RoleName}"
    arn_attributes:
      RoleName: role
    operations:
      create:
        - iam:PutRolePolicy
      update:
        - iam:PutRolePolicy
      delete:
        - iam:DeleteRolePolicy

  - type: aws_iam_instance_profile
    service: iam
    status: draft
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:instance-profile/${ProfileName}"
    arn_attributes:
      ProfileName: name
    operations:
      create:
        - iam:CreateInstanceProfile
        - iam:AddRoleToInstanceProfile
      update:
        - iam:AddRoleToInstanceProfile
        - iam:RemoveRoleFromInstanceProfile
      delete:
        - iam:DeleteInstanceProfile
        - iam:RemoveRoleFromInstanceProfile

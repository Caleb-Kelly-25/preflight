# AWS Identity and Access Management
#
# VERIFICATION STATUS — see the per-entry verified_operations fields.
#
# Names checked against AWS's own policy validator
# (accessanalyzer:ValidatePolicy), which is authoritative for action names.
#
# An earlier version of this header also claimed the validator confirmed "every
# arn_format matches the resource type its actions accept". It does not — the
# validator checks NAMES ONLY and reports nothing at all for an action scoped to
# a resource type it cannot apply to. The arn_formats here are now checked
# separately by `go run ./cmd/arncheck`, against AWS's machine-readable service
# reference, which CI runs on every pull request.
#
# COMPLETENESS is the dimension that matters, because a missing action produces
# a false "allowed" for a deploy that will fail. Every entry in this file whose
# create path has been derived was found to be WRONG, always in that direction:
# aws_iam_role missing 5, aws_iam_policy 2, aws_iam_instance_profile 2,
# aws_iam_role_policy 1, aws_iam_role_policy_attachment 1.
#
# UPDATE paths are now derived for two entries, and both were wrong in the same
# direction. aws_iam_policy took three fixtures; aws_iam_role took six, one per
# updatable attribute, and closed two false passes — it listed nothing at all for
# a permissions-boundary change. Every other update path here is still reasoning.
#
# aws_iam_role is `verified` as of 2026-09-26, the second fully-verified entry in
# the database and the first whose update path is measured rather than reasoned.
#
# Known gaps, listed rather than guessed at:
#   - Deleting a role that still has inline policies or attachments requires
#     removing them first; whether the provider does that itself is unresolved.
#   - Every update path except aws_iam_policy's and aws_iam_role's is unverified.
#     They are the hardest to derive, because the required actions depend on
#     which attributes changed, so each branch of each gate needs its own
#     two-phase fixture — six of them for aws_iam_role alone.
#   - No delete path can be derived by the harness at all: teardown always runs
#     with operator credentials, so a missing delete permission can never
#     surface. Delete paths marked verified were established by other means.
#
# Reference: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html

resources:
  - type: aws_iam_role
    service: iam
    # VERIFIED 2026-09-26: every operation now has a measurement behind it, and
    # the evidence is in mappings/evidence/aws_iam_role.json rather than in this
    # prose. All three operations are machine-measured against provider 6.66.0;
    # delete was reproduced by the harness on 2026-09-26, which retired the last
    # pre-harness claim in this entry.
    status: verified
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:role/${RoleName}"
    arn_attributes:
      RoleName: name
    # Terraform generates the name at apply time when name_prefix is used.
    arn_prefix_attributes:
      RoleName: name_prefix
    context_keys:
      "aws:RequestTag/*":
        from: tags

    # Terraform reads the role back after every write. Derived empirically
    # 2026-09-01 against provider v5.100.0: removing any one of these fails both
    # apply and destroy.
    read_actions:
      - iam:GetRole
      - iam:ListRolePolicies
      - iam:ListAttachedRolePolicies

    operations:
      create:
        - iam:CreateRole
        # CreateRole takes tags as a parameter and IAM authorises iam:TagRole
        # for them, with no TagRole call ever appearing. An untagged role needs
        # neither.
        # GATE MEASURED both directions 2026-09-25: an untagged role derives
        # to four actions and reports this one surplus.
        - action: iam:TagRole
          when: { attribute_set: [tags, tags_all] }
      # UPDATE DERIVED 2026-09-26 against provider 6.66.0 by six two-phase
      # fixtures, one per updatable attribute. Every gate below is measurement,
      # not reasoning, and two of them closed false passes.
      update:
        - action: iam:UpdateRoleDescription
          when: { attribute_changed: [description] }
        # MEASURED, and narrowed. IAM's UpdateRole API covers description AND
        # max_session_duration, so this was previously gated on both "in case the
        # provider ever switches". Two fixtures settled it: a description change
        # needs UpdateRoleDescription and reports UpdateRole surplus, and a
        # max_session_duration change does exactly the reverse.
        #
        # Narrowing a gate is the edit that can introduce a false pass, so it is
        # tied to the provider version in the evidence file. A provider bump
        # should re-derive rather than assume.
        - action: iam:UpdateRole
          when: { attribute_changed: [max_session_duration] }
        - action: iam:UpdateAssumeRolePolicy
          when: { attribute_changed: [assume_role_policy] }
        # BOTH WERE MISSING, and both were false passes: this entry listed
        # nothing at all for a permissions-boundary change, so a plan attaching a
        # boundary to a role — or taking one off — was reported as needing no
        # permission for it. Its own notes admitted the gap and it sat there.
        #
        # Measured in both directions separately, because IAM has separate
        # actions for them and reasoning by symmetry is how the other half of a
        # pair gets shipped wrong. Each over-reports on the opposite direction,
        # which is the safe side.
        - action: iam:PutRolePermissionsBoundary
          when: { attribute_changed: [permissions_boundary] }
        - action: iam:DeleteRolePermissionsBoundary
          when: { attribute_changed: [permissions_boundary] }
        - action: iam:TagRole
          when: { attribute_changed: [tags, tags_all] }
        - action: iam:UntagRole
          when: { attribute_changed: [tags, tags_all] }
      delete:
        - iam:DeleteRole
        - iam:ListInstanceProfilesForRole
    notes: >-
      Create and delete were established empirically on 2026-09-01 against
      provider v5.100.0: a role holding exactly iam:CreateRole, iam:TagRole,
      iam:DeleteRole plus the three read_actions and
      iam:ListInstanceProfilesForRole applies and destroys a tagged role, and
      removing any one of those seven fails. The previous entry listed three of
      them and was wrong in the dangerous direction.

      iam:TagRole is required on create even though no TagRole API call is made:
      CreateRole accepts tags as a parameter and IAM authorises iam:TagRole for
      them. It does not appear in CloudTrail, which is why observing API calls
      is not by itself a sound way to derive an action list.

      iam:ListInstanceProfilesForRole is needed only on delete — the provider
      checks for attached instance profiles before removing a role.

      UPDATE DERIVED 2026-09-26 against provider 6.66.0, which is what promoted
      this entry from draft. Six two-phase fixtures, one per updatable attribute,
      because an update path depends on which attribute changed and a branch
      nobody measured is a false pass:

        description          -> iam:UpdateRoleDescription
        max_session_duration -> iam:UpdateRole
        assume_role_policy   -> iam:UpdateAssumeRolePolicy
        permissions_boundary -> iam:PutRolePermissionsBoundary   (added)
        permissions_boundary -> iam:DeleteRolePermissionsBoundary (removed)
        tags                 -> iam:TagRole and iam:UntagRole

      plus the three read_actions on every one. Each was sufficiency- and
      minimality-proven.

      TWO FALSE PASSES WERE CLOSED. Both permissions-boundary actions were
      absent, so attaching a boundary to a role — or removing one — was reported
      as needing no permission at all. The previous version of this note admitted
      the gap and left it open.

      One gate was NARROWED on measurement. iam:UpdateRole was gated on
      description as well as max_session_duration, defensively, in case the
      provider switched which API it used. It does not: a description change
      needs UpdateRoleDescription and reports UpdateRole surplus, and a
      max_session_duration change does the reverse. Narrowing is the edit that
      can introduce a false pass, so it is pinned to the provider version in the
      evidence file and a bump should re-derive rather than assume.

      Update is complete because those are the only attributes AWS can change in
      place. name, name_prefix and path all force replacement, which Terraform
      plans as delete plus create — both of which are mapped.

      CREATE RE-DERIVED 2026-09-26 at 6.66.0 from the new maximal fixture, with
      an identical result to the 5.100.0 hand run. The maximal fixture sets a
      permissions boundary, which answered a second open question: creating a
      role WITH a boundary needs no action beyond iam:CreateRole, because
      CreateRole takes the boundary as a parameter and IAM authorises it there.

      DELETE DERIVED 2026-09-26 against provider 6.66.0, and it reproduced the
      2026-09-01 hand run EXACTLY: the same five actions, zero missing, zero
      surplus, minimality proven. iam:ListInstanceProfilesForRole is confirmed
      load-bearing on delete.

      That retired the weakest claim in this entry. Until then delete rested on a
      hand measurement two provider major versions old that nothing could
      reproduce, because the harness was believed unable to derive a delete path at
      all. It could: "teardown must use operator credentials" is right about the
      cleanup and was wrongly applied to the measurement as well. The scratch role
      now destroys to be measured, and the operator destroy still runs afterwards
      to guarantee the account ends clean.

      It also needed no new fixture — a delete derivation reuses the create
      fixture, applying it with operator credentials and then destroying it under
      the scratch role.

      Separately: any OTHER resource that hands this role to a service (an ECS
      task definition, a Lambda function) needs iam:PassRole on it. That is a
      cross-resource requirement this per-resource schema does not yet express.

  - type: aws_iam_policy
    service: iam
    # VERIFIED 2026-09-26. All three operations are machine-measured — create
    # 2026-09-25, update and delete 2026-09-26 — with the transcripts in
    # mappings/evidence/aws_iam_policy.json rather than in this prose.
    #
    # Update is complete because `policy` and `tags` are the only attributes AWS can
    # change in place; name, path and description all force replacement, which
    # Terraform plans as delete plus create, both of which are measured.
    status: verified
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:policy/${PolicyName}"
    arn_attributes:
      PolicyName: name
    arn_prefix_attributes:
      PolicyName: name_prefix
    # DERIVED 2026-09-25. Both were missing, and both are read-backs: the entry
    # declared no read_actions at all, which is now the third time that shape
    # has under-reported, after aws_s3_bucket (by 14) and aws_iam_role (by 5).
    read_actions:
      - iam:GetPolicy
      - iam:GetPolicyVersion
    operations:
      create:
        - iam:CreatePolicy
        # Gated by analogy with iam:TagRole, whose mechanism is identical —
        # CreatePolicy takes tags as a parameter and IAM authorises the tagging
        # action for them with no separate call. The gate itself is REASONED,
        # not measured: the fixture always sets tags, so the untagged case was
        # never exercised.
        # GATE MEASURED both directions 2026-09-25 (was reasoned by analogy
        # with iam:TagRole; now proven): an untagged policy reports it surplus.
        - action: iam:TagPolicy
          when: { attribute_set: [tags, tags_all] }
      # UPDATE DERIVED 2026-09-26 by three separate two-phase fixtures, because
      # an update path depends on WHICH attribute changed and each branch of the
      # gate needs its own measurement. See the notes for the numbers.
      update:
        # Changing the document. iam:ListPolicyVersions was MISSING — the first
        # update path ever measured, and wrong in the dangerous direction.
        - action: iam:CreatePolicyVersion
          when: { attribute_changed: [policy] }
        - action: iam:ListPolicyVersions
          when: { attribute_changed: [policy] }
        # KEPT although minimisation proved it droppable, which is the first time
        # a surplus finding has been deliberately ignored. AWS caps a managed
        # policy at five versions and the provider prunes the oldest when it hits
        # that cap; going from one version to two never reaches it, so no fixture
        # that applies phase 2 once can exercise the pruning. Dropping it on
        # this evidence would produce a false pass for any policy already updated
        # five times, which is an ordinary policy, not an edge case.
        - action: iam:DeletePolicyVersion
          when: { attribute_changed: [policy] }
        # Changing tags. BOTH were missing, and the entry listed nothing at all
        # for a tags-only update: the engine would have reported such a plan as
        # needing no tagging permission whatsoever.
        #
        # UntagPolicy over-reports when tags are only added; it is required when
        # one is removed, and the plan cannot always distinguish the two cheaply.
        - action: iam:TagPolicy
          when: { attribute_changed: [tags, tags_all] }
        - action: iam:UntagPolicy
          when: { attribute_changed: [tags, tags_all] }
      delete:
        - iam:DeletePolicy
        # MISSING UNTIL MEASURED 2026-09-26. The provider lists a policy's versions
        # before deleting it — AWS refuses to delete a policy that still has
        # non-default versions, so they have to be found first.
        #
        # It cannot go in read_actions: the create path was measured and does NOT
        # need it, so unioning it into every operation would over-report on every
        # policy creation. Per-operation is the honest placement.
        - iam:ListPolicyVersions
    notes: >-
      CREATE DERIVED BY THE HARNESS 2026-09-25 against AWS provider 6.63.0, and
      RE-DERIVED 2026-09-26 against 6.66.0 with an identical result: sufficiency
      proven, minimality proven. A role holding exactly iam:CreatePolicy,
      iam:TagPolicy, iam:GetPolicy and iam:GetPolicyVersion creates a tagged
      managed policy, and removing any one of the four fails.

      The re-derivation is worth more than a repeated result. Derived sets are
      pinned to a provider version and are expected to drift; this is the first
      evidence in the database of a set surviving a provider bump. The exact
      numbers live in mappings/evidence/aws_iam_policy.json, which the harness
      writes and CI checks.

      The previous entry claimed two of those and was wrong in the dangerous
      direction: it would have reported "allowed" for a deploy that cannot
      succeed.

      UPDATE DERIVED 2026-09-26 against AWS provider 6.66.0, by the harness's
      new two-phase mode: phase 1 establishes the resource with operator
      credentials, phase 2 applies the change under the scratch role, so what is
      measured is the update alone and not the create as well.

      Three fixtures were needed, because an update path depends on which
      attribute changed and a branch nobody measured is a false pass:

      aws_iam_policy__update (document changed) derived iam:CreatePolicyVersion,
      iam:ListPolicyVersions, iam:GetPolicy, iam:GetPolicyVersion in 8 attempts,
      sufficiency and minimality both proven. iam:ListPolicyVersions was MISSING
      from this entry.

      aws_iam_policy__update_tags (tag changed and tag removed) derived
      iam:TagPolicy, iam:UntagPolicy plus the two reads, in 11 attempts. BOTH
      were missing, and the update path listed nothing for tags at all — a plan
      changing only tags would have been reported as needing no tagging
      permission.

      aws_iam_policy__update_default_tags (provider default_tags changed, the
      resource's own tags untouched) derived iam:TagPolicy plus the two reads, in
      9 attempts. That one is not really about this entry: it proved that gating
      a tagging action on `tags` alone is a false pass, because default_tags
      merge into the computed tags_all and never touch tags. Every tags gate in
      the database was corrected to name both.

      update is marked verified because policy and tags are the only attributes
      that can be updated IN PLACE, and both are now measured. description was
      checked directly on 2026-09-26 and forces replacement, as do name and
      path; a replacement is a create plus a delete, not an update.

      iam:DeletePolicyVersion is retained against the measurement. See the
      comment on it above: the five-version pruning limit is unreachable by a
      fixture that applies its change once, and dropping it would be a false
      pass for any policy already updated five times.

      delete remains unmeasured, but is now derivable — see aws_iam_role, whose
      delete path was measured on 2026-09-26. It reuses the create fixture, so this
      entry needs no new one; it simply has not been run yet.

  - type: aws_iam_role_policy_attachment
    service: iam
    status: draft
    # Create derived by the harness 2026-09-25; update and delete were not.
    # Delete derived 2026-09-26 with SUPPORT=./derivefixtures/support/iam_role.
    verified_operations: [create, delete]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:role/${RoleName}"
    arn_attributes:
      RoleName: role
    # DERIVED 2026-09-25 and MISSING before. The entry declared no
    # read_actions, which has now predicted an under-report nine times out
    # of nine: Terraform reads every resource back after writing it.
    read_actions:
      - iam:ListAttachedRolePolicies
    operations:
      create:
        - iam:AttachRolePolicy
      update:
        - iam:AttachRolePolicy
        - iam:DetachRolePolicy
      delete:
        - iam:DetachRolePolicy
    notes: >-
      CREATE DERIVED BY THE HARNESS 2026-09-25 against AWS provider 6.63.0:
      sufficiency proven. The entry omitted iam:ListAttachedRolePolicies, and was
      therefore wrong in the dangerous direction — it would have reported
      "allowed" for a deploy that cannot succeed.

      DELETE DERIVED 2026-09-26 and already correct. It needed no new fixture: a
      delete reuses the create fixture, applied with operator credentials and then
      destroyed under the scratch role.

      UPDATE REMAINS UNMEASURED, and is the only gap left in this entry.

  - type: aws_iam_role_policy
    service: iam
    status: draft
    # Create derived by the harness 2026-09-25; update and delete were not.
    # Delete derived 2026-09-26 with SUPPORT=./derivefixtures/support/iam_role.
    verified_operations: [create, delete]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:role/${RoleName}"
    arn_attributes:
      RoleName: role
    # DERIVED 2026-09-25, and missing before: the entry declared no read_actions,
    # which is now four for four as a predictor of under-reporting.
    read_actions:
      - iam:GetRolePolicy
    operations:
      create:
        - iam:PutRolePolicy
      update:
        - iam:PutRolePolicy
      delete:
        - iam:DeleteRolePolicy
    notes: >-
      CREATE DERIVED BY THE HARNESS 2026-09-25 against AWS provider 6.63.0:
      sufficiency proven, minimality proven. A role holding exactly
      iam:PutRolePolicy and iam:GetRolePolicy attaches an inline policy, and
      removing either fails.

      The entry claimed only iam:PutRolePolicy and was wrong in the dangerous
      direction. Every entry so far with an empty read set has been.

      The fixture (derivefixtures/aws_iam_role_policy) does NOT create the role
      it attaches to. That is deliberate: a fixture that created its own role
      would need iam:CreateRole and friends, and the derivation would attribute
      those to this resource type. The role is a support resource created out of
      band, which makes the fixture non-self-contained — the right trade, because
      a derived set only means anything if exactly one resource type is in play.

  - type: aws_iam_instance_profile
    service: iam
    status: draft
    # Create derived by the harness 2026-09-25; update and delete were not.
    # Delete derived 2026-09-26 with SUPPORT=./derivefixtures/support/iam_role.
    verified_operations: [create, delete]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_identityandaccessmanagement.html
    arn_format: "arn:${Partition}:iam::${Account}:instance-profile/${ProfileName}"
    arn_attributes:
      ProfileName: name
    # DERIVED 2026-09-25 and missing before. iam:GetRole is NOT here — it is
    # authorised against the role rather than the profile, so it sits under
    # `references`; see the comment there.
    read_actions:
      - iam:GetInstanceProfile
    operations:
      create:
        - iam:CreateInstanceProfile
        - action: iam:AddRoleToInstanceProfile
          when: { attribute_set: role }
      update:
        - action: iam:AddRoleToInstanceProfile
          when: { attribute_changed: [role] }
        - action: iam:RemoveRoleFromInstanceProfile
          when: { attribute_changed: [role] }
      delete:
        - iam:DeleteInstanceProfile
        - action: iam:RemoveRoleFromInstanceProfile
          when: { attribute_set: role }
    # MEASURED 2026-09-02. AddRoleToInstanceProfile requires iam:PassRole
    # against the ROLE being added, not against the instance profile:
    #
    #   AccessDenied ... not authorized to perform: iam:PassRole
    #   on resource: arn:aws:iam::<acct>:role/<target>
    #
    # Granting the five instance-profile actions alone is not enough, and this
    # entry claimed exactly that until now — a false "allowed" for a deploy that
    # cannot succeed. AWS's own docs associate PassRole with launching an
    # instance rather than with building the profile, so reading them would have
    # produced the same wrong answer.
    #
    # `role` holds a role NAME here, not an ARN, hence arn_format.
    references:
      - action: iam:PassRole
        arn_from: role
        arn_format: "arn:${Partition}:iam::${Account}:role/${Name}"
        operations: [create, update]
        when: { attribute_set: role }

      # DERIVED 2026-09-25, and it belongs HERE rather than in read_actions.
      # The provider reads the role back, so iam:GetRole is genuinely required —
      # but it is authorised against the ROLE, not against the instance profile.
      # Putting it in read_actions would scope it to this entry's own ARN, which
      # cmd/arncheck flags as a mismatch and which would report a policy
      # correctly scoped to the role as a missing permission.
      # DELETE ADDED 2026-09-26 after measurement: the provider reads the role back
      # when REMOVING it from the profile too, not only when adding it.
      #
      # The scoping here was exactly half right, which is the interesting part.
      # iam:PassRole above is correctly limited to create and update — the same run
      # did NOT report it missing, because removing a role from a profile does not
      # pass it anywhere. Two references against the same attribute, needing
      # different operation sets, and only measurement separates them.
      - action: iam:GetRole
        arn_from: role
        arn_format: "arn:${Partition}:iam::${Account}:role/${Name}"
        operations: [create, update, delete]
        when: { attribute_set: role }

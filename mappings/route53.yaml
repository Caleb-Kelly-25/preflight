# Amazon Route 53
#
# Names checked 2026-09-26 against AWS's machine-readable service reference, not
# a docs page.
#
# aws_route53_zone's CREATE PATH IS DERIVED (2026-09-26, provider 6.66.0) and was
# wrong by omission, like every other entry ever measured: route53:GetChange was
# missing. Its update and delete paths, and everything about aws_route53_record,
# are still reasoning. Both entries stay `draft`, so findings are capped at
# `Likely`.
#
# ROUTE 53 ARNs ARE GLOBAL, and this is the one thing about the service that
# breaks an assumption made everywhere else in the database:
#
#   arn:${Partition}:route53:::hostedzone/${Id}
#
# There is no region and no account — two empty fields. An entry that templated
# the caller's region or account in here would build an ARN that matches nothing
# and every simulation against it would come back denied, which looks exactly
# like a real permission gap. The formats below are written with the fields
# empty, deliberately.
#
# THE ZONE ID IS ASSIGNED BY AWS (Z1D633PJN98FT9, not the domain name), so an
# ARN cannot be built from a zone's `name`. Both entries template from `zone_id`
# instead, which is computed on the zone and an input on the record. That means:
#
#   - creating a zone degrades to "*", because its id does not exist yet;
#   - updating or deleting one resolves exactly, from prior state;
#   - a record in an EXISTING zone resolves exactly;
#   - a record in a zone created by the same plan degrades to "*", because the
#     zone_id it references is unknown until the zone is applied.
#
# That last case is the common one in practice, and it is an honest "not
# checked" rather than a wrong answer.
#
# Reference: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonroute53.html

resources:
  - type: aws_route53_zone
    service: route53
    status: draft
    # Create and delete derived 2026-09-26 (see notes and mappings/evidence/).
    # Update is not yet run, though it is derivable.
    verified_operations: [create, delete]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonroute53.html
    # Empty region and account are correct, not an oversight. See the header.
    arn_format: "arn:${Partition}:route53:::hostedzone/${Id}"
    arn_attributes:
      Id: zone_id
    context_keys:
      "aws:RequestTag/*":
        from: tags

    # Route 53 keeps tags behind a separate call rather than returning them from
    # GetHostedZone, so reading a zone back takes two calls.
    read_actions:
      - route53:GetHostedZone
      - route53:ListTagsForResource

    # route53:GetChange — a FIXED-TARGET reference, and the reason that schema
    # form exists.
    #
    # Route 53 answers a zone or record change with an ephemeral change id, and
    # the provider polls GetChange on it until the change has propagated to all
    # of Route 53's name servers. It is a real call on the create path and it was
    # MISSING from this file until it was measured on 2026-09-26.
    #
    # It cannot go in `read_actions`. Those are scoped to the resource's own ARN,
    # so the engine would ask AWS whether the caller may GetChange on a
    # *hostedzone* — a question whose answer is always an implicit deny, because
    # the action does not apply to that resource type. A policy correctly granting
    # GetChange on change/* would then be reported as a missing permission on
    # every Route 53 plan.
    #
    # No plan attribute holds a change id and none ever could, so the target is
    # the wildcard a real policy actually grants. That is what AWS's own
    # documentation shows, because the id is not knowable in advance by anyone.
    references:
      - action: route53:GetChange
        arn_format: "arn:${Partition}:route53:::change/*"
        operations: [create, update, delete]

    operations:
      create:
        # CreateHostedZone authorises against "*" ONLY — the service reference
        # lists no resource type for it. The zone does not exist yet and has no
        # id to be named, so there is nothing to scope to. Scoping it here is
        # harmless but has no effect, which `cmd/arncheck` reports as a note.
        - route53:CreateHostedZone
        # Route 53 tags through one call that both adds and removes, so there is
        # no separate Add/Remove pair as in ELB or IAM.
        - action: route53:ChangeTagsForResource
          when: { attribute_set: [tags, tags_all] }
      update:
        - action: route53:UpdateHostedZoneComment
          when: { attribute_changed: [comment] }
        # A private zone is associated with one or more VPCs, and changing that
        # set is an authorised call in its own right.
        - action: route53:AssociateVPCWithHostedZone
          when: { attribute_changed: [vpc] }
        - action: route53:ChangeTagsForResource
          when: { attribute_changed: [tags, tags_all] }
      delete:
        - route53:DeleteHostedZone
        # BOTH MISSING UNTIL MEASURED 2026-09-26, and route53:GetDNSSEC was not in
        # this file at all — nobody would have reasoned their way to it. The
        # provider inspects a zone's DNSSEC configuration and lists its record sets
        # before removing it.
        #
        # Neither belongs in read_actions: the create path was measured and needs
        # neither, so unioning them in would over-report on every zone creation.
        - route53:GetDNSSEC
        - route53:ListResourceRecordSets

    notes: >-
      CREATE DERIVED 2026-09-26 against provider 6.66.0 from
      derivefixtures/aws_route53_zone: sufficiency proven, minimality proven,
      7 attempts. A role holding exactly route53:CreateHostedZone,
      route53:ChangeTagsForResource, route53:GetChange, route53:GetHostedZone and
      route53:ListTagsForResource creates a tagged public zone, and removing any
      one of the five fails.

      Deriving this was affordable in a way most of the database is not: a public
      hosted zone needs no VPC, creates in seconds, and AWS does not charge for
      one deleted within twelve hours — so a run that creates and destroys a dozen
      costs nothing.

      STILL DRAFT. Update and delete are unmeasured, and two specific questions
      remain open in the dangerous direction:

      DELETE DERIVED 2026-09-26 against provider 6.66.0, 9 attempts, sufficiency
      and minimality proven. TWO actions were missing, and route53:GetDNSSEC was
      not in this file at all — nobody would have reasoned their way to it. The
      provider inspects a zone's DNSSEC configuration and lists its record sets
      before removing it.

      PARTLY ANSWERED, and the remaining half matters:
      route53:ChangeResourceRecordSets was NOT required. But the fixture's zone
      held only the NS and SOA sets AWS creates itself, which AWS removes along
      with the zone — so `force_destroy` was set and never had anything to do. A
      zone holding USER-created records may well still need it, and this run cannot
      say. Deriving that needs a fixture with a record in it, which makes it a
      two-resource-type fixture and therefore a deliberate trade.

      Whether route53:DisassociateVPCFromHostedZone is needed when a VPC
      association is removed rather than added. Only the Associate half is listed.
      That is the same shape as the permissions-boundary pair on aws_iam_role,
      where measuring only one direction WOULD have shipped a false pass, so it
      should be measured rather than reasoned — it needs a private zone, hence a
      VPC, hence a fixture that is no longer about one resource type.

      route53:GetChange WAS missing, and this entry's previous notes named it as
      "the most likely thing to be missing" while leaving it out. It was — the
      derivation found it, which is a second instance of a documented gap being a
      shipped bug rather than a known limitation.

      Fixing it needed a small schema addition: a `references` entry with no
      `arn_from`, whose `arn_format` is a fixed ARN. GetChange is authorised
      against the ephemeral `change` resource, no plan attribute holds a change
      id and none could, and folding it into read_actions would have scoped it to
      the hosted zone — producing a false POSITIVE on every Route 53 plan. See
      the comment on the reference.

  - type: aws_route53_record
    service: route53
    status: draft
    # Create and delete derived 2026-09-26 against a zone from
    # SUPPORT=./derivefixtures/support/route53_zone, whose id is passed in as a
    # Terraform variable. Update is the same ChangeResourceRecordSets call and is not
    # separately measured.
    verified_operations: [create, delete]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonroute53.html
    # A record is not a resource AWS authorises against. Every call is authorised
    # against the HOSTED ZONE that contains it, which is why this entry's
    # arn_format names a hostedzone and not a record — there is no record
    # resource type in the service reference at all.
    arn_format: "arn:${Partition}:route53:::hostedzone/${Id}"
    arn_attributes:
      Id: zone_id

    # Reading a record back means listing the zone's record sets; there is no
    # GetResourceRecordSet call.
    read_actions:
      - route53:ListResourceRecordSets
      # MISSING UNTIL MEASURED 2026-09-26, and required on create AND delete: the
      # provider reads the containing zone before writing a record into it. Nobody
      # reasoning from the docs would list it — a record operation looks like it
      # concerns only the record.
      - route53:GetHostedZone

    # Same fixed-target reference as the zone entry, and for the same reason:
    # ChangeResourceRecordSets returns a change id the provider polls.
    #
    # UNMEASURED HERE. It was measured for aws_route53_zone, where it was missing,
    # and a record change goes through the identical propagation wait — so
    # omitting it would almost certainly be a false pass. It is listed on the
    # reasoning that the mechanism is the same call on the same service, which is
    # weaker than measurement and is why this entry stays draft. Deriving it needs
    # a fixture whose hosted zone is created out of band, so that exactly one
    # resource type is in play.
    references:
      - action: route53:GetChange
        arn_format: "arn:${Partition}:route53:::change/*"
        operations: [create, update, delete]

    # One API call covers create, update and delete: ChangeResourceRecordSets
    # takes CREATE, UPSERT and DELETE actions in its change batch. So all three
    # operations map to the same single action, which is unusual in this database
    # and is correct here rather than a copy-paste error.
    operations:
      create:
        - route53:ChangeResourceRecordSets
      update:
        - route53:ChangeResourceRecordSets
      delete:
        - route53:ChangeResourceRecordSets

    notes: >-
      DRAFT. Names checked 2026-09-26; completeness unestablished.

      Records carry no tags, so there is no tagging action and no tags gate —
      one of the few entries in the database where that is true.

      The ARN is the containing zone, not the record. That is AWS's model, not a
      simplification: the service reference has no record resource type, and a
      policy controlling records does it by scoping ChangeResourceRecordSets to a
      hostedzone ARN. Condition keys narrow it further —
      route53:ChangeResourceRecordSetsRecordTypes and
      route53:ChangeResourceRecordSetsActions are how a policy says "may edit
      CNAMEs but not NS records". Neither is declared in `context_keys` here, so
      a policy using them will be evaluated without them and may come back
      denied when the real call would succeed. That is a false positive, the
      recoverable direction, and it is the first thing to fix if this entry is
      taken further.

      CREATE AND DELETE DERIVED 2026-09-26 against provider 6.66.0, 6 attempts each,
      sufficiency and minimality proven. Both needed the same four actions, which is
      unsurprising: one API call serves create, update and delete here.

      route53:GetHostedZone WAS MISSING. The provider reads the containing zone
      before writing a record into it, and nobody reasoning from the docs would list
      it — a record operation looks like it concerns only the record. This is the
      second Route 53 action found by measurement that no amount of reading would
      have produced, after route53:GetDNSSEC on the zone's delete path.

      route53:GetChange is no longer reasoning: it was measured required here too,
      which retires the caveat this note used to carry.

      Measuring it needed the support fixture's OUTPUT rather than a shared constant,
      because a zone id is assigned by AWS. A `data "aws_route53_zone"` lookup would
      have been simpler and wrong: data sources are read under the scratch role, so
      route53:ListHostedZonesByName would have been discovered by the loop and
      attributed to this resource type, which does not need it.

# Amazon EC2 / VPC networking
#
# VERIFICATION STATUS — see the per-entry status fields.
#
# Two dimensions must hold before an entry is `verified`; see README.md.
#   1. Names            - checked via accessanalyzer:ValidatePolicy. That
#                         validates NAMES ONLY; it does not check that an action
#                         can apply to the ARN it is scoped to, so the
#                         arn_formats below remain unverified.
#   2. Completeness     - proven only by granting a role exactly the mapped
#                         actions and running a real terraform apply.
#
# A note specific to this service. Most ec2:Describe* actions do NOT support
# resource-level permissions: a policy must grant them on "*". That is fine for
# simulation, because a policy granting "*" matches any ARN we scope to — but it
# means a denial on a Describe action almost always indicates a genuinely absent
# grant rather than a scoping mismatch.
#
# Reference: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonec2.html

resources:
  - type: aws_vpc
    service: ec2
    status: draft
    # Create and delete were derived empirically against provider 6.63.0 on
    # 2026-09-02, and create was independently reproduced by the derivation
    # harness on 2026-09-04; update was not. See notes.
    verified_operations: [create, delete]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonec2.html
    arn_format: "arn:${Partition}:ec2:${Region}:${Account}:vpc/${VpcId}"
    arn_attributes:
      VpcId: id
    context_keys:
      "aws:RequestTag/*":
        from: tags
    # Both measured load-bearing: removing either fails the apply.
    # ec2:DescribeTags was in the first draft of this entry and is NOT needed —
    # removing it changes nothing, so it was over-reporting.
    read_actions:
      - ec2:DescribeVpcs
      - ec2:DescribeVpcAttribute
    operations:
      create:
        - ec2:CreateVpc
        # Measured load-bearing. Note this differs mechanically from IAM:
        # CreateVpc accepts TagSpecifications so no separate tagging call is
        # made, yet ec2:CreateTags is still required to authorise it.
        - action: ec2:CreateTags
          when: { attribute_set: tags }
        # Measured load-bearing for a VPC whose DNS attributes differ from the
        # defaults. Left unconditional rather than gated on the dns attributes:
        # gating is the edit that can under-report, and this was only measured
        # with them set.
        - ec2:ModifyVpcAttribute
      update:
        - ec2:ModifyVpcAttribute
        - action: ec2:CreateTags
          when: { attribute_changed: [tags] }
        - action: ec2:DeleteTags
          when: { attribute_changed: [tags] }
      delete:
        - ec2:DeleteVpc
    notes: >-
      DERIVED EMPIRICALLY 2026-09-02 against AWS provider 6.63.0, and
      independently reproduced by the derivation harness on 2026-09-04:
      sufficiency proven, minimality proven, zero surplus, zero missing.

      A role holding exactly ec2:CreateVpc, ec2:CreateTags,
      ec2:ModifyVpcAttribute, ec2:DescribeVpcs and ec2:DescribeVpcAttribute
      applies a tagged VPC with non-default DNS attributes; adding ec2:DeleteVpc
      destroys it. Every one was confirmed load-bearing by removing it and
      watching the apply fail with a named denial.

      The fixture is derivefixtures/aws_vpc, whose committed lock file pins the
      provider version this result is valid for. A future run against a
      different provider may legitimately disagree.

      Update is NOT verified: it was never exercised, and its actions are
      inferred rather than measured.

      The id attribute is unknown until apply, so a create is simulated against
      "*" and any denial is inconclusive. That is inherent to VPCs rather than a
      gap in this entry: the identifier is assigned by AWS.

      ec2:CreateTags is gated on tags being set, which was measured only in the
      tagged direction — an untagged VPC was not tested.

  - type: aws_subnet
    service: ec2
    status: draft
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonec2.html
    arn_format: "arn:${Partition}:ec2:${Region}:${Account}:subnet/${SubnetId}"
    arn_attributes:
      SubnetId: id
    context_keys:
      "aws:RequestTag/*":
        from: tags
    read_actions:
      - ec2:DescribeSubnets
      - ec2:DescribeTags
    operations:
      create:
        - ec2:CreateSubnet
        - action: ec2:CreateTags
          when: { attribute_set: tags }
        - action: ec2:ModifySubnetAttribute
          when: { attribute_set: map_public_ip_on_launch }
      update:
        - ec2:ModifySubnetAttribute
        - action: ec2:CreateTags
          when: { attribute_changed: [tags] }
        - action: ec2:DeleteTags
          when: { attribute_changed: [tags] }
      delete:
        - ec2:DeleteSubnet

  - type: aws_security_group
    service: ec2
    status: draft
    # Create was derived by the harness against provider 6.63.0 on 2026-09-25:
    # sufficiency proven, minimality proven. Delete and update were not.
    verified_operations: [create]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonec2.html
    arn_format: "arn:${Partition}:ec2:${Region}:${Account}:security-group/${GroupId}"
    arn_attributes:
      GroupId: id
    context_keys:
      "aws:RequestTag/*":
        from: tags
    # Measured load-bearing. The first draft of this entry also listed
    # ec2:DescribeSecurityGroupRules and ec2:DescribeTags; the derivation proved
    # both unnecessary. That is the second time ec2:DescribeTags has been a
    # surplus guess — aws_vpc had it too — so the provider evidently reads tags
    # back from the resource's own Describe call rather than separately.
    read_actions:
      - ec2:DescribeSecurityGroups
    operations:
      create:
        - ec2:CreateSecurityGroup
        - action: ec2:CreateTags
          when: { attribute_set: tags }
        # A security group is created empty; inline rules are separate calls.
        - action: ec2:AuthorizeSecurityGroupIngress
          when: { attribute_set: ingress }
        - action: ec2:AuthorizeSecurityGroupEgress
          when: { attribute_set: egress }
        # Terraform revokes the default allow-all egress rule when the
        # configuration specifies its own, which is a separate authorisation.
        - action: ec2:RevokeSecurityGroupEgress
          when: { attribute_set: egress }
      update:
        - action: ec2:AuthorizeSecurityGroupIngress
          when: { attribute_changed: [ingress] }
        - action: ec2:RevokeSecurityGroupIngress
          when: { attribute_changed: [ingress] }
        - action: ec2:AuthorizeSecurityGroupEgress
          when: { attribute_changed: [egress] }
        - action: ec2:RevokeSecurityGroupEgress
          when: { attribute_changed: [egress] }
        - action: ec2:CreateTags
          when: { attribute_changed: [tags] }
        - action: ec2:DeleteTags
          when: { attribute_changed: [tags] }
      delete:
        - ec2:DeleteSecurityGroup
    notes: >-
      CREATE DERIVED BY THE HARNESS 2026-09-25 against AWS provider 6.63.0:
      sufficiency proven, minimality proven, 11 attempts. The six actions above
      are each load-bearing; the first draft also claimed
      ec2:DescribeSecurityGroupRules and ec2:DescribeTags, and both were proven
      unnecessary.

      The fixture (derivefixtures/aws_security_group) sets tags, an ingress rule
      AND an egress rule on purpose. The egress rule is the subtle one: AWS
      attaches an allow-all egress rule to every new security group, and
      Terraform must revoke it before applying its own. A fixture without egress
      would never exercise ec2:RevokeSecurityGroupEgress and would under-report
      for everyone who restricts egress.

      Because the fixture sets all three attributes, every `when` gate above was
      true throughout. The gates are therefore still reasoning, not measurement:
      an untagged group, or one with no rules, was never tested.

      Update and delete are unverified. Delete in particular is never exercised
      by the harness, which tears down with operator credentials so that teardown
      cannot fail for want of the permission being searched for.

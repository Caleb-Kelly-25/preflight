# Amazon S3
#
# VERIFICATION STATUS — see the per-entry status and verified_operations fields.
# aws_s3_bucket is fully verified; every other entry here has a derived CREATE
# path and unverified update/delete paths.
#
# Two dimensions must hold before an entry is `verified`; see README.md.
#   1. Names            - checked via accessanalyzer:ValidatePolicy. NAMES ONLY:
#                         measured 2026-09-25, it reports nothing for an action
#                         scoped to a resource type it cannot apply to. The
#                         arn_formats are checked separately, by cmd/arncheck
#                         against AWS's machine-readable service reference.
#   2. Completeness     - proven only by granting a role exactly the mapped
#                         actions and running a real terraform apply.
#
# Every entry in this file that was measured had been wrong, and always in the
# dangerous direction. aws_s3_bucket under-reported by 14 actions; each
# sub-resource entry omitted exactly one read-back. The predictor was the same
# every time: an entry with no read_actions. Terraform reads every resource back
# after writing it, so an empty read set nearly always means nobody checked.
#
# Reference: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazons3.html

resources:
  - type: aws_s3_bucket
    service: s3
    status: verified
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazons3.html
    arn_format: "arn:${Partition}:s3:::${BucketName}"
    arn_attributes:
      BucketName: bucket
    arn_prefix_attributes:
      BucketName: bucket_prefix
    resource_policy_capable: [update, delete]
    context_keys:
      # Deploy roles are commonly gated on tags at creation time. Sourcing the
      # value matters in both directions: unsupplied, a tag condition can deny
      # (which we would then suppress as inconclusive) or silently allow.
      "aws:RequestTag/*":
        from: tags

    # Terraform reads the bucket back after every write, and each of these is
    # hard-required — derived empirically, one AccessDenied at a time, against
    # provider v5.100.0. See the note below.
    read_actions:
      - s3:ListBucket
      - s3:GetAccelerateConfiguration
      - s3:GetBucketAcl
      - s3:GetBucketCORS
      - s3:GetBucketLogging
      - s3:GetBucketObjectLockConfiguration
      - s3:GetBucketPolicy
      - s3:GetBucketRequestPayment
      - s3:GetBucketTagging
      - s3:GetBucketVersioning
      - s3:GetBucketWebsite
      - s3:GetEncryptionConfiguration
      - s3:GetLifecycleConfiguration
      - s3:GetReplicationConfiguration

    operations:
      create:
        - s3:CreateBucket
        # The mirror of the IAM case: CreateBucket does NOT accept tags, so a
        # tagged bucket needs a second, separately-authorised call. An untagged
        # one needs neither.
        # GATE MEASURED both directions 2026-09-25: a role holding the other
        # 16 actions but NOT this one applies an untagged bucket successfully.
        - action: s3:PutBucketTagging
          when: { attribute_set: [tags, tags_all] }
      update:
        - action: s3:PutBucketTagging
          when: { attribute_changed: [tags, tags_all] }
      delete:
        - s3:DeleteBucket

    notes: >-
      VERIFIED EMPIRICALLY 2026-09-01, provider v5.100.0. A role holding exactly
      these 17 actions applies and destroys a tagged bucket; removing any one of
      them fails. The previous entry claimed 3 actions and was wrong in the
      dangerous direction — it would have reported "allowed" for a deploy that
      cannot succeed.

      Two things worth knowing. s3:PutBucketTagging is listed on create because
      CreateBucket does not accept tags, so a tagged bucket needs a second call;
      an untagged bucket does not, so this over-reports until the schema can
      express conditional actions. Over-reporting fails safe.

      And omitting s3:ListBucket does NOT fail cleanly: the provider retries
      HeadBucket until the apply times out. A missing permission that presents
      as a hang rather than an error is exactly the failure preflight exists to
      catch early.

      Still not covered: force_destroy, which empties the bucket first and needs
      s3:DeleteObject and s3:DeleteObjectVersion.

  - type: aws_s3_bucket_policy
    service: s3
    status: draft
    # Create derived by the harness 2026-09-25; update and delete were not.
    verified_operations: [create]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazons3.html
    arn_format: "arn:${Partition}:s3:::${BucketName}"
    arn_attributes:
      BucketName: bucket
    resource_policy_capable: [create, update, delete]
    # DERIVED 2026-09-25 and MISSING before. The entry declared no
    # read_actions, which has now predicted an under-report nine times out
    # of nine: Terraform reads every resource back after writing it.
    read_actions:
      - s3:GetBucketPolicy
    operations:
      create:
        - s3:PutBucketPolicy
      update:
        - s3:PutBucketPolicy
      delete:
        - s3:DeleteBucketPolicy
    notes: >-
      CREATE DERIVED BY THE HARNESS 2026-09-25 against AWS provider 6.63.0:
      sufficiency proven. The entry omitted s3:GetBucketPolicy, and was
      therefore wrong in the dangerous direction — it would have reported
      "allowed" for a deploy that cannot succeed.

      Update and delete are unmeasured, but both are now derivable. Delete in
      particular needs NO new fixture — it reuses the create fixture, applying it
      with operator credentials and then destroying it under the scratch role.
      That became possible on 2026-09-26, when the harness stopped conflating the
      teardown that MEASURES with the teardown that CLEANS UP; this entry simply
      has not been run yet.

  - type: aws_s3_bucket_versioning
    service: s3
    status: draft
    # Create derived by the harness 2026-09-25; update and delete were not.
    verified_operations: [create]
    source: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazons3.html
    arn_format: "arn:${Partition}:s3:::${BucketName}"
    arn_attributes:
      BucketName: bucket
    # Unlike creating the bucket itself, this acts on a bucket that already
    # exists, so that bucket's own policy can deny PutBucketVersioning
    # regardless of what the identity policy allows.
    resource_policy_capable: [create, update, delete]
    # DERIVED 2026-09-25 and MISSING before. The entry declared no
    # read_actions, which has now predicted an under-report nine times out
    # of nine: Terraform reads every resource back after writing it.
    read_actions:
      - s3:GetBucketVersioning
    operations:
      create:
        - s3:PutBucketVersioning
      update:
        - s3:PutBucketVersioning
      delete:
        - s3:PutBucketVersioning
    notes: >-
      CREATE DERIVED BY THE HARNESS 2026-09-25 against AWS provider 6.63.0:
      sufficiency proven. The entry omitted s3:GetBucketVersioning, and was
      therefore wrong in the dangerous direction — it would have reported
      "allowed" for a deploy that cannot succeed.

      Minimality came back PARTIAL rather than proven: one removal produced a
      non-denial outcome, so that action is kept on weaker evidence than a clean
      AccessDenied.

      Update and delete are unmeasured, but both are now derivable. Delete in
      particular needs NO new fixture — it reuses the create fixture, applying it
      with operator credentials and then destroying it under the scratch role.
      That became possible on 2026-09-26, when the harness stopped conflating the
      teardown that MEASURES with the teardown that CLEANS UP; this entry simply
      has not been run yet.

      Destroying this resource does not remove versioning; Terraform suspends
      it, which is still a PutBucketVersioning call.


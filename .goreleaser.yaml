# GoReleaser builds the binaries that `action.yml` downloads. The two files are
# a matched pair: the archive naming below is what the Action reconstructs at
# runtime, and `checksums.txt` is what it verifies against. Renaming an archive
# here without changing the Action breaks every workflow using it.
#
# Run `goreleaser check` after editing. CI does too.
version: 2

project_name: preflight

before:
  hooks:
    # `go mod download`, not `go mod tidy`: a release must not be able to
    # rewrite go.mod. CI already enforces tidiness on every pull request, so by
    # the time a tag exists the question is settled.
    - go mod download

builds:
  - id: preflight
    main: ./cmd/preflight
    binary: preflight

    env:
      # The binary has to run on distroless images, Alpine CI containers and
      # whatever base image a team happens to use. Dynamic linking against a
      # host libc is how a release "works on ubuntu-latest" and fails everywhere
      # else. Nothing in the tool needs cgo.
      - CGO_ENABLED=0

    flags:
      # Keeps build-machine paths out of the binary.
      - -trimpath

    ldflags:
      # `main.version` is declared as an empty string in cmd/preflight/main.go
      # precisely so this can fill it; without it the binary reports "dev" and a
      # bug report cannot be tied to a release. `.Version` has the leading "v"
      # stripped by GoReleaser, so it is put back here — `preflight version`
      # should print the tag as a reader would type it.
      - -s -w -X main.version=v{{ .Version }}

    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: preflight
    # Only one build exists, so it needs no explicit id list here.

    # tar.gz on every platform, Windows included. The Action extracts with one
    # command on all three runner families, and Git Bash — the shell a composite
    # action gets on a Windows runner — ships GNU tar, which cannot read a zip.
    # A second archive format would buy nothing and add a branch to the one step
    # that must not be subtly wrong.
    formats: [tar.gz]

    # Reconstructed by action.yml. `.Version` is the tag without its "v".
    name_template: "preflight_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  # Load-bearing, not decoration: the Action refuses to run a binary whose
  # SHA-256 is absent from or disagrees with this file.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  # A tag like v0.2.0-rc.1 publishes as a pre-release without anyone having to
  # remember to tick a box.
  prerelease: auto

  footer: |
    ## Verifying a download

    Every archive's SHA-256 is listed in `checksums.txt`. Check it before you
    run the binary:

    ```
    sha256sum --ignore-missing -c checksums.txt
    ```

    Releases are not signed yet.

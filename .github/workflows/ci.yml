name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job here needs write access or secrets. This tool's whole premise is that
# it runs without touching real infrastructure; its own CI should hold to that.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # preflight runs in other people's CI, so it is tested on the platforms
        # those runners actually use.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # No unit test may touch AWS. Scrubbing the environment means a stray real
      # call fails loudly rather than quietly succeeding against whatever
      # credentials happen to be present.
      - name: Test
        run: go test ./...
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          AWS_PROFILE: ""
          AWS_REGION: ""
          AWS_EC2_METADATA_DISABLED: "true"

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
        env:
          AWS_EC2_METADATA_DISABLED: "true"

  # The contract tests are excluded from every normal build, so without this
  # they would rot unnoticed until someone next needed them.
  contract-build:
    name: contract tests compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -tags awsintegration ./...
      - run: go vet -tags awsintegration ./...

  # The derivation harness is excluded from every normal build and creates real
  # AWS resources when run, so CI only ever compiles it.
  derive-build:
    name: derive harness compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -tags awsderive ./...
      - run: go vet -tags awsderive ./...
      # The harness must never be reachable from the binary users run in CI.
      - name: cmd/preflight does not import internal/derive
        run: |
          if go list -deps ./cmd/preflight | grep -q 'internal/derive'; then
            echo "cmd/preflight imports internal/derive; the harness must stay out of the shipped binary"
            exit 1
          fi

  vet:
    name: vet and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy'"
            exit 1
          fi

  # The release pipeline runs only on a tag, which is the worst possible moment
  # to discover it is misconfigured — the tag exists by then, and a bad release
  # is visible to everyone watching the repository. So its configuration is
  # checked on every pull request instead.
  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

      # One target is enough to prove the build, archive and checksum sections
      # hold together; cross-compiling all six here would cost minutes on every
      # pull request to catch nothing extra.
      - name: Snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: build --snapshot --clean --single-target

      - name: Snapshot binary reports a version
        run: |
          bin=$(find dist -type f -name preflight | head -n 1)
          got=$("$bin" version)
          echo "version: $got"
          if [ -z "$got" ] || [ "$got" = "dev" ]; then
            echo "ldflags did not stamp a version into the binary"
            exit 1
          fi

      # action.yml is YAML nobody parses until a workflow uses it, and a typo
      # in an input name surfaces as a confusing runtime failure in someone
      # else's repository.
      - name: action.yml is well formed
        run: |
          python3 - <<'PY'
          import re, yaml

          action = yaml.safe_load(open("action.yml"))
          assert action["runs"]["using"] == "composite", "DESIGN §12: composite, not docker"

          want_inputs = {"plan", "fail-on", "format", "config-dir", "principal", "region", "version"}
          missing = want_inputs - set(action["inputs"])
          assert not missing, f"action.yml is missing inputs: {sorted(missing)}"
          assert action["inputs"]["plan"]["required"] is True

          want_outputs = {"exit-code", "sarif-file"}
          missing = want_outputs - set(action["outputs"])
          assert not missing, f"action.yml is missing outputs: {sorted(missing)}"

          # VERSION carries no leading "v": the release workflow adds it when
          # comparing against the tag, and the archive names have it stripped.
          version = open("VERSION").read().strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?", version), \
              f"VERSION must be X.Y.Z with an optional pre-release suffix, got {version!r}"
          PY

  # Checks that every mapped action can actually authorize against the resource
  # type its entry's arn_format names. accessanalyzer:ValidatePolicy cannot do
  # this — it validates action NAMES only — so without this job every arn_format
  # in the database is unverified, and a too-broad one produces a false
  # "allowed" rather than a visible false positive.
  #
  # It reads a public AWS endpoint and needs no credentials. It is deliberately
  # NOT part of `go test`, which must run offline.
  # The Action had never run on a real runner. Its download, checksum and
  # extraction paths were exercised by hand against the v0.1.0 artifacts, but
  # nothing had ever `uses:`-ed it, so the one completely unexercised surface in
  # the product was the part that fetches and executes a binary.
  #
  # DORMANT WHILE THE REPOSITORY IS PRIVATE, and it enables itself the moment that
  # changes. Release assets of a private repository are not downloadable without
  # credentials, so the action's `curl` gets a flat 404 — measured 2026-09-26, on
  # all three runner families. That is not a bug in action.yml: the URL it builds
  # is correct, and `release-assets` below proves the name it asks for is exactly
  # the name published. It is a fact about where the artifacts live, and it means
  # the action genuinely cannot be exercised end to end until the repository is
  # public. A job that fails for a reason nobody intends to fix is worse than no
  # job, so this one waits rather than going red.
  #
  # When it does run, with no AWS credentials configured preflight cannot answer
  # and exits 2 — itself a documented contract worth testing. Reaching that exit
  # code proves everything up to the AWS call works on a real runner:
  #
  #   resolve  RUNNER_OS / RUNNER_ARCH mapped to a real archive name
  #   install  download, checksum verification, extraction, `preflight version`
  #   run      binary invoked, exit code captured, outputs written
  #   result   exit 2 classified as "could not run", not as a finding
  #
  # What it still does NOT cover: a run with real credentials, and therefore the
  # SARIF round trip onto a pull request. Both need secrets and an owner
  # decision.
  # What the action-smoke job below cannot check while this repository is
  # private: that every archive name the action is capable of asking for is
  # actually published, and is covered by checksums.txt.
  #
  # This is the failure mode worth guarding. The action reconstructs the archive
  # name from RUNNER_OS and RUNNER_ARCH; goreleaser decides what gets built. The
  # two agree today and nothing connected them, so dropping a platform from the
  # build matrix — or changing `name_template` — would break the action for that
  # platform silently, and only for the users on it.
  #
  # It reads the release through the API with the job's own token, so it works on
  # a private repository, which is exactly why it carries the coverage while the
  # end-to-end job waits.
  release-assets:
    name: release assets match what the action asks for
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Every (os, arch) the action can resolve is published and checksummed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version#v}"
          echo "checking release $tag"

          # If no release exists yet for the version in VERSION, there is nothing
          # to check and nothing wrong — the release workflow runs on the tag.
          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "no release $tag yet; nothing to check"
            exit 0
          fi

          assets="$(gh release view "$tag" --repo "$REPO" --json assets -q '.assets[].name')"
          echo "published:"; echo "$assets" | sed 's/^/  /'

          gh release download "$tag" --repo "$REPO" --pattern checksums.txt --output checksums.txt --clobber

          # The same mapping action.yml performs, kept deliberately as a literal
          # list: generating it from the same source the action uses would make
          # the two agree by construction and check nothing.
          missing=0
          for pair in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64" "windows arm64"; do
            set -- $pair
            archive="preflight_${version#v}_$1_$2.tar.gz"

            if ! echo "$assets" | grep -qxF "$archive"; then
              echo "::error title=release-assets::$archive is not published in $tag, but the action will ask for it on $1/$2"
              missing=1
              continue
            fi
            # The action refuses to run a binary that is not in checksums.txt, so
            # a published-but-unchecksummed archive is a hard failure there too.
            if ! awk -v f="$archive" '$2 == f || $2 == "*" f { found=1 } END { exit !found }' checksums.txt; then
              echo "::error title=release-assets::$archive is published but absent from checksums.txt; the action would refuse to run it"
              missing=1
              continue
            fi
            echo "ok: $archive (published, checksummed)"
          done
          exit $missing

  action-smoke:
    name: action install (${{ matrix.os }})
    # github.event.repository is absent on some event types, so this is written to
    # require an explicit `false` rather than to trust a missing value.
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # `uses: ./` runs the action from this checkout, so the workflow tests the
      # action.yml in the commit rather than a published tag. The binary it
      # downloads is still the real released artifact, which is the point —
      # the checksum path is only meaningful against a real release.
      - id: preflight
        uses: ./
        continue-on-error: true
        with:
          plan: internal/plan/testdata/simple.tfplan.json

      - name: The action reached preflight and reported it could not run
        shell: bash
        env:
          CODE: ${{ steps.preflight.outputs.exit-code }}
        run: |
          set -euo pipefail
          echo "exit-code=${CODE:-<empty>}"

          # An empty output means the action failed BEFORE the run step — a
          # broken download, a checksum mismatch, an archive that did not
          # contain the binary. That is the failure this job exists to catch,
          # and it is worth distinguishing loudly from a real exit code.
          if [ -z "${CODE:-}" ]; then
            echo "::error title=action-smoke::the action produced no exit-code output, so it never reached the binary; check the resolve and install steps above"
            exit 1
          fi

          # 2 is "preflight could not complete the check" — here, no credentials.
          # 0 or 1 would mean it somehow reached AWS, which on a runner with no
          # credentials configured would be more alarming than a failure.
          if [ "$CODE" != "2" ]; then
            echo "::error title=action-smoke::expected exit code 2 with no AWS credentials, got '$CODE'"
            exit 1
          fi
          echo "the action installed a checksum-verified binary and ran it"

  arn-scoping:
    name: arn_format scoping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # No --strict: a mismatch fails, but an unreachable endpoint does not.
      # A job that reddens the build because a third party had an outage is a
      # job people learn to route around, and this repository already treats a
      # false alarm as a real cost.
      - run: go run ./cmd/arncheck

  # The mapping database is the product's credibility. A structurally broken
  # entry silently reduces coverage in the field, so it gets its own visible
  # check rather than hiding inside the general test job.
  mappings:
    name: mapping database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run TestShippedDatabase -v ./internal/mapping/...
      - name: Coverage summary
        run: go run ./cmd/preflight mappings list
